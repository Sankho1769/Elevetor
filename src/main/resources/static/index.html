<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infinity Tower — Elevator Control &amp; Monitoring System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B1220; --bg-1:#121A2B; --bg-2:#182335; --bg-2-hi:#1F2C42;
    --glass:rgba(24,35,53,0.55); --glass-strong:rgba(24,35,53,0.75); --glass-hi:rgba(255,255,255,0.05);
    --glass-border:rgba(255,255,255,0.12); --glass-inset:inset 0 1px 0 rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --accent:#3B82F6; --accent-dim:rgba(59,130,246,0.16);
    --accent-2:#14B8A6; --accent-2-dim:rgba(20,184,166,0.16);
    --warning:#F59E0B; --warning-dim:rgba(245,158,11,0.14);
    --danger:#EF4444; --danger-dim:rgba(239,68,68,0.14);
    --success:#22C55E; --success-dim:rgba(34,197,94,0.14);
    --text-0:#F8FAFC; --text-1:#CBD5E1; --text-2:#94A3B8;
    --p-normal:#94A3B8; --p-staff:#3B82F6; --p-elderly:#F59E0B; --p-disabled:#14B8A6;
    --p-vip:#A78BFA; --p-medical:#EF4444; --p-emergency:#EF4444; --p-firefighter:#FB7185;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter','Poppins','Segoe UI', sans-serif;
    --shadow-soft: 0 4px 24px rgba(0,0,0,0.28); --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-0);color:var(--text-0);font-family:var(--sans);overflow:hidden;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  .icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  #app{display:grid;grid-template-columns:1fr 420px;grid-template-rows:58px 1fr;height:100vh;width:100vw;grid-template-areas:"topbar topbar" "sim panel";}
  @media (max-width:980px){ #app{grid-template-columns:1fr;grid-template-rows:58px 44vh 1fr;grid-template-areas:"topbar" "sim" "panel";} }

  #topbar{grid-area:topbar;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--glass-border);box-shadow:var(--glass-inset);flex-wrap:wrap;gap:8px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;}
  .brand-text{font-weight:700;font-size:15.5px;} .brand-sub{font-size:10px;color:var(--text-2);letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .clock{font-family:var(--mono);font-size:12.5px;color:var(--accent-2);background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:8px;padding:7px 10px;}
  .conn-badge{font-size:10.5px;font-weight:700;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);backdrop-filter:blur(10px);}
  .conn-badge.connected{color:var(--success);border-color:var(--success);background:var(--success-dim);}
  .conn-badge.disconnected{color:var(--danger);border-color:var(--danger);background:var(--danger-dim);}
  .conn-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .btn{position:relative;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);color:var(--text-1);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s;box-shadow:var(--glass-inset);}
  .btn:hover{border-color:var(--border-strong);background:var(--glass-strong);transform:translateY(-1px);box-shadow:var(--shadow-soft), var(--glass-inset);}
  .btn:active{transform:translateY(1px) scale(.97);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .btn.small{padding:6px 10px;font-size:11px;}

  #sim{grid-area:sim;position:relative;background:radial-gradient(ellipse 900px 500px at 30% -8%, rgba(59,130,246,0.05), transparent 60%), var(--bg-0);overflow:hidden;display:flex;flex-direction:column;}
  #simHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0 20px;gap:10px;flex-wrap:wrap;}
  #simHeader h1{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:700;margin:0;display:flex;align-items:center;gap:8px;}
  #statOverlay{display:flex;gap:10px;flex-wrap:wrap;}
  .stat-chip{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glass-border);border-radius:9px;padding:7px 13px;min-width:74px;box-shadow:var(--shadow-soft), var(--glass-inset);}
  .stat-chip .v{font-family:var(--mono);font-size:16px;font-weight:700;} .stat-chip .l{font-size:9px;color:var(--text-2);text-transform:uppercase;font-weight:600;margin-top:3px;}
  #shaftWrap{flex:1;position:relative;overflow:auto;padding:10px 20px 20px 20px;}
  #alertBar{position:absolute;top:0;left:0;right:0;padding:9px 20px;background:rgba(239,68,68,0.85);backdrop-filter:blur(10px);color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;gap:10px;z-index:30;}
  #startOverlay{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(11,18,32,0.55);backdrop-filter:blur(14px);transition:opacity .3s,visibility .3s;}
  #startOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .start-card{background:var(--glass-strong);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-border);border-radius:14px;padding:32px 36px;text-align:center;max-width:340px;box-shadow:var(--shadow-soft), var(--glass-inset);}
  .start-card h2{font-size:16px;margin:0 0 6px 0;} .start-card p{font-size:12px;color:var(--text-2);margin:0 0 22px 0;line-height:1.5;}
  .fab-start{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:13px 26px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px;box-shadow:0 8px 30px rgba(59,130,246,0.4);}

  #panel{grid-area:panel;background:var(--glass);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-left:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden;}
  #tabs{display:flex;border-bottom:1px solid var(--glass-border);overflow-x:auto;background:rgba(18,26,43,0.35);flex-shrink:0;}
  .tab{flex:0 0 auto;padding:13px 14px;font-size:11px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:700;text-transform:uppercase;}
  .tab:hover{color:var(--text-0);background:var(--bg-2);} .tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-dim);}
  #tabContent{flex:1;overflow-y:auto;padding:18px;}
  .panel-section{margin-bottom:22px;} .panel-section h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-2);margin:0 0 12px 0;display:flex;gap:8px;font-weight:700;}
  .panel-section h3::after{content:'';flex:1;height:1px;background:var(--border);align-self:center;}
  .field-row{display:flex;gap:10px;margin-bottom:10px;} .field{flex:1;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10.5px;color:var(--text-2);font-weight:600;}
  .field input,.field select{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--glass-border);color:var(--text-0);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--mono);width:100%;}
  .checkline{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:6px;cursor:pointer;}
  .algo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .algo-card{position:relative;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:9px;padding:10px 11px;cursor:pointer;font-size:11px;color:var(--text-1);box-shadow:var(--glass-inset);}
  .algo-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-soft), var(--glass-inset);} .algo-card.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .algo-card .name{font-weight:700;display:block;margin-bottom:3px;} .algo-card .desc{font-size:9.5px;color:var(--text-2);line-height:1.35;}
  .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .metric-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:10px;padding:12px;box-shadow:var(--glass-inset);}
  .metric-card .mc-top{display:flex;justify-content:space-between;margin-bottom:8px;} .metric-card .mc-value{font-family:var(--mono);font-size:19px;font-weight:700;}
  .metric-card .mc-label{font-size:9.5px;color:var(--text-2);text-transform:uppercase;font-weight:600;margin-top:2px;}
  .safety-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;} .safety-btn{position:relative;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:9px;padding:10px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--glass-inset);}
  .safety-btn:hover{border-color:var(--border-strong);transform:translateY(-1px);} .safety-btn.active{border-color:var(--danger);color:var(--danger);background:var(--danger-dim);}
  .elevator-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;} .es-btn{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);border-radius:7px;padding:6px 10px;font-size:11px;cursor:pointer;font-family:var(--mono);font-weight:700;}
  .es-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .hint{font-size:10px;color:var(--text-2);line-height:1.5;margin-top:6px;}
  .log-filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;} .chip-filter{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);color:var(--text-2);border-radius:14px;padding:4px 11px;font-size:10px;cursor:pointer;font-weight:600;}
  .chip-filter.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  #logSearch{width:100%;margin-bottom:10px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--glass-border);color:var(--text-0);border-radius:8px;padding:7px 10px;font-size:11.5px;}
  #logList{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10.5px;}
  .log-entry{padding:7px 9px;border-radius:7px;border-left:3px solid var(--border-strong);background:var(--glass);backdrop-filter:blur(8px);color:var(--text-1);}
  .log-entry.dispatch{border-left-color:var(--accent);} .log-entry.passenger{border-left-color:var(--accent-2);}
  .log-entry.safety{border-left-color:var(--warning);} .log-entry.fault{border-left-color:var(--danger);} .log-entry.system{border-left-color:var(--accent-2);}
  .log-entry .t{color:var(--text-2);margin-right:6px;}
  .bar-track{background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:5px;height:14px;overflow:hidden;margin-top:4px;} .bar-fill{height:100%;background:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <div class="mark"><svg class="icon" style="width:20px;height:20px;stroke:var(--accent)" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h2"/></svg></div>
      <div><div class="brand-text" id="buildingNameDisplay">Infinity Tower</div><div class="brand-sub">Live Backend · Elevator Control System</div></div>
    </div>
    <div class="topbar-right">
      <div class="conn-badge disconnected" id="connBadge"><span class="conn-dot"></span><span id="connText">Connecting…</span></div>
      <div class="clock" id="simClock">DAY 1 · 00:00:00</div>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn" id="speedBtn">1×</button>
    </div>
  </div>
  <div id="sim">
    <div id="startOverlay">
      <div class="start-card">
        <h2>Infinity Tower Control System</h2>
        <p>Connected to the live backend. Start the simulation to begin dispatching elevators server-side.</p>
        <button class="fab-start" id="startFab">Start Simulation</button>
      </div>
    </div>
    <div id="alertBar"><span id="alertText"></span></div>
    <div id="simHeader"><h1>Live Building Monitor</h1><div id="statOverlay"></div></div>
    <div id="shaftWrap"><canvas id="shaftCanvas"></canvas></div>
  </div>
  <div id="panel">
    <div id="tabs">
      <div class="tab active" data-tab="config">Config</div>
      <div class="tab" data-tab="requests">Requests</div>
      <div class="tab" data-tab="algorithm">Algorithm</div>
      <div class="tab" data-tab="safety">Safety</div>
      <div class="tab" data-tab="analytics">Analytics</div>
      <div class="tab" data-tab="reports">Reports</div>
      <div class="tab" data-tab="logs">Logs</div>
    </div>
    <div id="tabContent"></div>
  </div>
</div>
<script>
(function(){
const API = window.location.origin;
const WS_URL = (window.location.protocol==='https:'?'wss':'ws')+'://'+window.location.host+'/ws/simulation';

const ui = {
  activeTab:'config', theme:'dark', started:false,
  logFilter:'all', logSearch:'', selectedElevatorForFault:0,
  algoStats:{}, history:{waitTime:[],travelTime:[],utilization:[],energy:[],requestsPerMin:[],faults:[]}, lastSampleSec:0, lastTotalRequests:0
};
let snapshot = null;
let ws = null;

const ALGO_META = {
  fcfs:'First request, first served, in arrival order.',
  scan:'Sweeps to the end of the shaft, then reverses.',
  look:'Reverses at the last request, not the shaft end.',
  sstf:'Always serves the physically closest request.',
  collective:'Picks up same-direction calls along the way.',
  nearest:'Hall call goes to the nearest idle-capable car.',
  sector:'Each car owns a floor band; calls route by sector.',
  destination:'Groups riders by destination before boarding.',
  adaptive:'Switches strategy with live traffic conditions.',
  ai:'Weighted multi-factor scoring per elevator.'
};
const PRIORITY_COLOR = {normal:'var(--p-normal)',staff:'var(--p-staff)',elderly:'var(--p-elderly)',disabled:'var(--p-disabled)',vip:'var(--p-vip)',medical:'var(--p-medical)',emergency:'var(--p-emergency)',firefighter:'var(--p-firefighter)'};

async function api(path, method, body){
  const res = await fetch(API+path, {
    method: method||'GET',
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error('API error '+res.status+' on '+path);
  const ct = res.headers.get('content-type')||'';
  return ct.includes('application/json') ? res.json() : res.text();
}

function connectWebSocket(){
  ws = new WebSocket(WS_URL);
  ws.onopen = ()=>{ setConn(true); };
  ws.onclose = ()=>{ setConn(false); setTimeout(connectWebSocket, 2000); };
  ws.onerror = ()=>{ setConn(false); };
  ws.onmessage = (evt)=>{
    snapshot = JSON.parse(evt.data);
    onSnapshot();
  };
}
function setConn(connected){
  const badge = document.getElementById('connBadge');
  badge.className = 'conn-badge '+(connected?'connected':'disconnected');
  document.getElementById('connText').textContent = connected? 'Live · Connected' : 'Reconnecting…';
}

function onSnapshot(){
  if(!snapshot) return;
  document.getElementById('buildingNameDisplay').textContent = snapshot.building.name;
  renderClock();
  renderStatOverlay();
  drawShaft();
  sampleHistory();
  if(ui.activeTab==='analytics') renderAnalyticsTab();
  if(ui.activeTab==='requests') renderHallCallList();
  if(ui.activeTab==='algorithm') renderAlgoBars();
  if(ui.activeTab==='safety') renderTab('safety');
  syncPauseButton();
}

function sampleHistory(){
  if(snapshot.simSeconds - ui.lastSampleSec < 2) return;
  const elapsedMin = Math.max(0.033, (snapshot.simSeconds - ui.lastSampleSec) / 60);
  const requestsDelta = snapshot.analytics.totalRequests - (ui.lastTotalRequests||0);
  ui.lastTotalRequests = snapshot.analytics.totalRequests;
  ui.lastSampleSec = snapshot.simSeconds;
  push('waitTime', snapshot.analytics.avgWaitTime);
  push('travelTime', snapshot.analytics.avgTravelTime);
  push('requestsPerMin', requestsDelta / elapsedMin);
  push('utilization', snapshot.analytics.utilizationPct);
  push('energy', snapshot.analytics.energy);
  push('faults', snapshot.analytics.faultCount);
  if(!ui.algoStats[snapshot.algorithm]) ui.algoStats[snapshot.algorithm] = [];
  ui.algoStats[snapshot.algorithm].push(snapshot.analytics.avgWaitTime);
  if(ui.algoStats[snapshot.algorithm].length>20) ui.algoStats[snapshot.algorithm].shift();
}
function push(key,val){ const a=ui.history[key]; a.push(val); if(a.length>60) a.shift(); }

function fmtClock(sec){
  const s=Math.floor(sec); const hh=String(Math.floor(s/3600)%24).padStart(2,'0');
  const mm=String(Math.floor(s/60)%60).padStart(2,'0'); const ss=String(s%60).padStart(2,'0');
  return hh+':'+mm+':'+ss;
}
function floorLabel(f){
  if(!snapshot) return String(f);
  if(f===snapshot.building.lobby) return 'LOBBY';
  if(f<0) return 'B'+Math.abs(f);
  return 'F'+f;
}
function floorTag(f){
  const b = snapshot.building;
  if(f===b.lobby) return 'Reception';
  if(b.vipFloors.includes(f)) return 'VIP Floor';
  if(b.serviceFloors.includes(f)) return 'Service';
  if(b.mechanicalFloors.includes(f)) return 'Mechanical';
  if(b.parkingFloors.includes(f)) return 'Parking';
  if(f<0) return snapshot.safety.flood? 'Basement · LOCKED' : 'Basement';
  return '';
}
function floorRange(){
  const b=snapshot.building; const floors=[];
  const bottom = b.basements>0? -b.basements : 1;
  for(let f=b.floors; f>=bottom; f--){ if(f===0) continue; floors.push(f); }
  return floors;
}

function renderClock(){
  document.getElementById('simClock').textContent = 'DAY '+snapshot.simDay+' · '+fmtClock(snapshot.simSeconds);
}
function renderStatOverlay(){
  const a = snapshot.analytics;
  const chips = [['Waiting', a.waitingPassengers], ['Avg Wait', a.avgWaitTime.toFixed(1)+'s'], ['Completed', a.completed],
    ['Active Cars', snapshot.elevators.filter(e=>e.state==='moving').length+'/'+snapshot.elevators.length]];
  document.getElementById('statOverlay').innerHTML = chips.map(c=>`<div class="stat-chip"><div class="v">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
  const s = snapshot.safety; const alerts=[];
  if(s.fire) alerts.push('FIRE ALARM ACTIVE'); if(s.smoke) alerts.push('SMOKE DETECTED');
  if(s.estop) alerts.push('EMERGENCY STOP'); if(s.power) alerts.push('POWER OUTAGE');
  if(s.earthquake) alerts.push('EARTHQUAKE PROTOCOL'); if(s.flood) alerts.push('FLOOD PROTOCOL — BASEMENTS LOCKED');
  const bar = document.getElementById('alertBar');
  if(alerts.length){ bar.style.display='flex'; document.getElementById('alertText').textContent = alerts.join(' · '); }
  else bar.style.display='none';
}

const canvas = document.getElementById('shaftCanvas'); const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const wrap = document.getElementById('shaftWrap');
  const floors = snapshot? floorRange() : [1];
  const elCount = snapshot? snapshot.elevators.length : 4;
  const w = Math.max(wrap.clientWidth-20, elCount*140+150);
  const h = Math.max(wrap.clientHeight-20, (floors.length+1)*48+70);
  canvas.width=w*devicePixelRatio; canvas.height=h*devicePixelRatio;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resizeCanvas);
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawPersonIcon(x,y,color,scale){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-scale*1.2,scale*0.62,0,7); ctx.fill(); roundRect(ctx,x-scale*0.75,y-scale*0.5,scale*1.5,scale*1.5,scale*0.5); ctx.fill(); }

function drawShaft(){
  if(!snapshot) return;
  resizeCanvas();
  const floors = floorRange().sort((a,b)=>b-a);
  const w=canvas.width/devicePixelRatio, h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  const labelW=78, roofRowH=34, rowH=(h-40-roofRowH)/floors.length;
  const carW = Math.min(104, (w-labelW-24)/snapshot.elevators.length - 12);
  const text1=cssVar('--text-1'), text2=cssVar('--text-2'), border=cssVar('--border-strong');
  const accent=cssVar('--accent'), danger=cssVar('--danger'), warning=cssVar('--warning'), success=cssVar('--success'), vip=cssVar('--p-vip'), bg2=cssVar('--bg-2');

  ctx.fillStyle=bg2; ctx.fillRect(labelW,16,w-labelW-14,roofRowH-2);
  ctx.strokeStyle=border; ctx.strokeRect(labelW,16,w-labelW-14,roofRowH-2);
  ctx.fillStyle=text2; ctx.font='700 10px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('◤ ROOF · MECHANICAL DECK', labelW+10, 16+roofRowH/2-1);

  floors.forEach((f,i)=>{
    const y=20+roofRowH+i*rowH;
    const activeFloor = snapshot.elevators.some(e=>Math.round(e.currentFloor)===f && (e.doorState==='open'||e.doorState==='opening'));
    if(activeFloor){ ctx.fillStyle=accent+'14'; ctx.fillRect(labelW,y,w-labelW-14,rowH); }
    ctx.strokeStyle=border; ctx.beginPath(); ctx.moveTo(labelW,y+rowH); ctx.lineTo(w-10,y+rowH); ctx.stroke();
    ctx.fillStyle = f===snapshot.building.lobby? accent : (snapshot.building.vipFloors.includes(f)? vip : text1);
    ctx.font='700 12px monospace'; ctx.fillText(floorLabel(f), 8, y+rowH/2-6);
    const tag = floorTag(f);
    if(tag){ ctx.fillStyle=text2; ctx.font='600 8.5px sans-serif'; ctx.fillText(tag, 8, y+rowH/2+8); }
    const waitCount = snapshot.passengers.filter(p=>p.state==='waiting' && p.origin===f).length;
    if(waitCount>0){
      ctx.fillStyle=warning; ctx.beginPath(); ctx.arc(labelW-12,y+rowH/2-10,7,0,7); ctx.fill();
      ctx.fillStyle='#1a1206'; ctx.font='700 9px monospace'; ctx.textAlign='center';
      ctx.fillText(waitCount, labelW-12, y+rowH/2-9); ctx.textAlign='left';
    }
  });

  snapshot.elevators.forEach((e,ei)=>{
    const x0=labelW+24+ei*(carW+16), shaftTop=16+roofRowH, shaftBottom=shaftTop+floors.length*rowH-4;
    ctx.strokeStyle=border; ctx.strokeRect(x0-4,shaftTop,carW+8,shaftBottom-shaftTop);
    ctx.fillStyle=text2; ctx.font='700 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('CAR '+e.label, x0+carW/2, shaftTop-10); ctx.textAlign='left';

    const topFloor=floors[0], botFloor=floors[floors.length-1];
    const frac=(topFloor-e.currentFloor)/(topFloor-botFloor);
    const carY = shaftTop+frac*(shaftBottom-shaftTop-rowH*0.82);
    const carH = rowH*0.82, carCenterX = x0+carW/2;

    ctx.strokeStyle=border; ctx.lineWidth=1.2; ctx.setLineDash([2,4]);
    ctx.lineDashOffset = -((snapshot.simSeconds*40)%6)*e.direction;
    ctx.beginPath(); ctx.moveTo(carCenterX,shaftTop); ctx.lineTo(carCenterX,carY); ctx.stroke(); ctx.setLineDash([]);

    let color=accent;
    if(e.fault) color=danger; else if(e.maintenance||e.inspection) color=warning;
    else if(e.state==='moving') color=success; else if(e.fault||e.maintenance) color=danger;

    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=10;
    const grad=ctx.createLinearGradient(x0,carY,x0,carY+carH); grad.addColorStop(0,color+'2A'); grad.addColorStop(1,color+'10');
    ctx.fillStyle=grad; ctx.strokeStyle=color; ctx.lineWidth=1.6;
    roundRect(ctx,x0,carY,carW,carH,6); ctx.fill(); ctx.stroke(); ctx.restore();

    const doorGap = e.doorState==='closed'? 0 : (e.doorState==='open'?1:e.doorProgress) * (carW*0.42);
    ctx.fillStyle=cssVar('--bg-0');
    if(e.doorState!=='closed'){ ctx.fillRect(x0+2,carY+2,Math.max(0,doorGap),carH-4); ctx.fillRect(x0+carW-2-doorGap,carY+2,Math.max(0,doorGap),carH-4); }
    ctx.strokeStyle=color+'70'; ctx.beginPath(); ctx.moveTo(x0+carW/2,carY+2); ctx.lineTo(x0+carW/2,carY+carH-2); ctx.stroke();

    ctx.fillStyle=cssVar('--bg-1'); ctx.strokeStyle=border; roundRect(ctx,x0+carW/2-19,carY-24,38,16,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=color; ctx.font='700 12px monospace'; ctx.textAlign='center'; ctx.fillText(floorLabel(Math.round(e.currentFloor)), x0+carW/2, carY-16);
    ctx.font='11px sans-serif'; ctx.fillStyle=e.direction!==0?color:text2;
    ctx.fillText(e.direction>0?'▲':e.direction<0?'▼':'—', x0+carW/2, carY-30); ctx.textAlign='left';

    const onboard = snapshot.passengers.filter(p=>p.state==='riding' && p.assignedElevatorId===e.id);
    const dotsPerRow=Math.ceil(Math.sqrt(snapshot.building.capacity));
    onboard.forEach((p,pi)=>{
      const col=pi%dotsPerRow, row=Math.floor(pi/dotsPerRow);
      drawPersonIcon(x0+10+col*9, carY+11+row*9, cssVar(PRIORITY_COLOR[p.priority]||'--p-normal'), 3.1);
    });

    const occFrac=e.passengerCount/snapshot.building.capacity, weightFrac=e.weight/snapshot.building.weightLimit;
    const barY=carY+carH+6;
    ctx.fillStyle=border; ctx.fillRect(x0,barY,carW,3);
    ctx.fillStyle= occFrac>0.9?danger:occFrac>0.7?warning:cssVar('--accent-2');
    ctx.fillRect(x0,barY,carW*Math.min(1,occFrac),3);
    ctx.font='600 8px monospace'; ctx.fillStyle=text2; ctx.fillText(e.passengerCount+'/'+snapshot.building.capacity, x0, barY+13);
    ctx.textAlign='right'; ctx.fillStyle= weightFrac>0.95?danger:weightFrac>0.75?warning:text2;
    ctx.fillText(Math.round(e.weight)+'kg', x0+carW, barY+13); ctx.textAlign='left';
  });

  floors.forEach((f,i)=>{
    const y=20+roofRowH+i*rowH;
    const waiting = snapshot.passengers.filter(p=>p.state==='waiting' && p.origin===f);
    waiting.slice(0,8).forEach((p,pi)=>{
      const px=labelW-8-((pi%4)*10), py=y+rowH/2+10+Math.floor(pi/4)*10;
      drawPersonIcon(px,py, cssVar(PRIORITY_COLOR[p.priority]||'--p-normal'), 2.6);
    });
  });
}

const CHART_DEFS=[['waitTime','Wait Time (s)'],['travelTime','Travel Time (s)'],['requestsPerMin','Requests / Minute'],['utilization','Utilization (%)'],['energy','Energy (kWh)'],['faults','Fault Count']];
let chartCtxs={};
function renderCharts(){
  const box=document.getElementById('chartsBox'); if(!box) return;
  if(!box.dataset.built){
    box.innerHTML = CHART_DEFS.map(([k,t])=>`<div style="background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:var(--glass-inset);"><div style="font-size:10.5px;font-weight:700;color:var(--text-1);margin-bottom:6px;">${t}</div><canvas id="cc-${k}" width="360" height="70" style="width:100%;height:70px;"></canvas></div>`).join('');
    box.dataset.built='1'; chartCtxs={}; CHART_DEFS.forEach(([k])=>chartCtxs[k]=document.getElementById('cc-'+k).getContext('2d'));
  }
  CHART_DEFS.forEach(([k])=>{
    const data=ui.history[k]; const cvs=chartCtxs[k].canvas; const cctx=chartCtxs[k];
    const w=cvs.clientWidth||360,h=70;
    if(cvs.width!==w*devicePixelRatio){ cvs.width=w*devicePixelRatio; cvs.height=h*devicePixelRatio; cctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    cctx.clearRect(0,0,w,h); if(data.length<2) return;
    const max=Math.max(1,...data); const color=cssVar('--accent');
    cctx.beginPath();
    data.forEach((v,i)=>{ const x=(i/59)*w, y=h-6-(v/max)*(h-14); if(i===0) cctx.moveTo(x,y); else cctx.lineTo(x,y); });
    cctx.strokeStyle=color; cctx.lineWidth=2; cctx.stroke();
  });
}
async function refreshLogs(){
  const params = new URLSearchParams();
  if(ui.logFilter!=='all') params.set('category', ui.logFilter);
  if(ui.logSearch) params.set('search', ui.logSearch);
  params.set('limit','150');
  try{
    const logs = await api('/api/logs?'+params.toString());
    const list = document.getElementById('logList'); if(!list) return;
    list.innerHTML = logs.slice().reverse().map(l=>`<div class="log-entry ${l.category}"><span class="t">Day ${l.simDay} ${l.simClock}</span>${escapeHtml(l.message)}</div>`).join('');

}

  nearest:'Hall call goes to the nearest idle-capable car.',
  sector:'Each car owns a floor band; calls route by sector.',
  destination:'Groups riders by destination before boarding.',
  adaptive:'Switches strategy with live traffic conditions.',
  ai:'Weighted multi-factor scoring per elevator.'
};
const PRIORITY_COLOR = {normal:'var(--p-normal)',staff:'var(--p-staff)',elderly:'var(--p-elderly)',disabled:'var(--p-disabled)',vip:'var(--p-vip)',medical:'var(--p-medical)',emergency:'var(--p-emergency)',firefighter:'var(--p-firefighter)'};

async function api(path, method, body){
  const res = await fetch(API+path, {
    method: method||'GET',
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error('API error '+res.status+' on '+path);
  const ct = res.headers.get('content-type')||'';
  return ct.includes('application/json') ? res.json() : res.text();
}

function connectWebSocket(){
  ws = new WebSocket(WS_URL);
  ws.onopen = ()=>{ setConn(true); };
  ws.onclose = ()=>{ setConn(false); setTimeout(connectWebSocket, 2000); };
  ws.onerror = ()=>{ setConn(false); };
  ws.onmessage = (evt)=>{
    snapshot = JSON.parse(evt.data);
    onSnapshot();
  };
}
function setConn(connected){
  const badge = document.getElementById('connBadge');
  badge.className = 'conn-badge '+(connected?'connected':'disconnected');
  document.getElementById('connText').textContent = connected? 'Live · Connected' : 'Reconnecting…';
}

function onSnapshot(){
  if(!snapshot) return;
  document.getElementById('buildingNameDisplay').textContent = snapshot.building.name;
  renderClock();
  renderStatOverlay();
  drawShaft();
  sampleHistory();
  if(ui.activeTab==='analytics') renderAnalyticsTab();
  if(ui.activeTab==='requests') renderHallCallList();
  if(ui.activeTab==='algorithm') renderAlgoBars();
  if(ui.activeTab==='safety'){
    const key = JSON.stringify({s:snapshot.safety, sel:ui.selectedElevatorForFault,
      els:snapshot.elevators.map(e=>[e.fault,e.maintenance,e.inspection,e.independentService])});
    if(key!==ui.lastSafetyKey){ ui.lastSafetyKey=key; renderTab('safety'); }
  }
  syncPauseButton();
}

function sampleHistory(){
  if(snapshot.simSeconds - ui.lastSampleSec < 2) return;
  const elapsedMin = Math.max(0.033, (snapshot.simSeconds - ui.lastSampleSec) / 60);
  const requestsDelta = snapshot.analytics.totalRequests - (ui.lastTotalRequests||0);
  ui.lastTotalRequests = snapshot.analytics.totalRequests;
  ui.lastSampleSec = snapshot.simSeconds;
  push('waitTime', snapshot.analytics.avgWaitTime);
  push('travelTime', snapshot.analytics.avgTravelTime);
  push('requestsPerMin', requestsDelta / elapsedMin);
  push('utilization', snapshot.analytics.utilizationPct);
  push('energy', snapshot.analytics.energy);
  push('faults', snapshot.analytics.faultCount);
  if(!ui.algoStats[snapshot.algorithm]) ui.algoStats[snapshot.algorithm] = [];
  ui.algoStats[snapshot.algorithm].push(snapshot.analytics.avgWaitTime);
  if(ui.algoStats[snapshot.algorithm].length>20) ui.algoStats[snapshot.algorithm].shift();
}
function push(key,val){ const a=ui.history[key]; a.push(val); if(a.length>60) a.shift(); }

function fmtClock(sec){
  const s=Math.floor(sec); const hh=String(Math.floor(s/3600)%24).padStart(2,'0');
  const mm=String(Math.floor(s/60)%60).padStart(2,'0'); const ss=String(s%60).padStart(2,'0');
  return hh+':'+mm+':'+ss;
}
function floorLabel(f){
  if(!snapshot) return String(f);
  if(f===snapshot.building.lobby) return 'LOBBY';
  if(f<0) return 'B'+Math.abs(f);
  return 'F'+f;
}
function floorTag(f){
  const b = snapshot.building;
  if(f===b.lobby) return 'Reception';
  if(b.vipFloors.includes(f)) return 'VIP Floor';
  if(b.serviceFloors.includes(f)) return 'Service';
  if(b.mechanicalFloors.includes(f)) return 'Mechanical';
  if(b.parkingFloors.includes(f)) return 'Parking';
  if(f<0) return snapshot.safety.flood? 'Basement · LOCKED' : 'Basement';
  return '';
}
function floorRange(){
  const b=snapshot.building; const floors=[];
  const bottom = b.basements>0? -b.basements : 1;
  for(let f=b.floors; f>=bottom; f--){ if(f===0) continue; floors.push(f); }
  return floors;
}

function renderClock(){
  document.getElementById('simClock').textContent = 'DAY '+snapshot.simDay+' · '+fmtClock(snapshot.simSeconds);
}
function renderStatOverlay(){
  const a = snapshot.analytics;
  const chips = [['Waiting', a.waitingPassengers], ['Avg Wait', a.avgWaitTime.toFixed(1)+'s'], ['Completed', a.completed],
    ['Active Cars', snapshot.elevators.filter(e=>e.state==='moving').length+'/'+snapshot.elevators.length]];
  document.getElementById('statOverlay').innerHTML = chips.map(c=>`<div class="stat-chip"><div class="v">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
  const s = snapshot.safety; const alerts=[];
  if(s.fire) alerts.push('FIRE ALARM ACTIVE'); if(s.smoke) alerts.push('SMOKE DETECTED');
  if(s.estop) alerts.push('EMERGENCY STOP'); if(s.power) alerts.push('POWER OUTAGE');
  if(s.earthquake) alerts.push('EARTHQUAKE PROTOCOL'); if(s.flood) alerts.push('FLOOD PROTOCOL — BASEMENTS LOCKED');
  const bar = document.getElementById('alertBar');
  if(alerts.length){ bar.style.display='flex'; document.getElementById('alertText').textContent = alerts.join(' · '); }
  else bar.style.display='none';
}

const canvas = document.getElementById('shaftCanvas'); const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const wrap = document.getElementById('shaftWrap');
  const floors = snapshot? floorRange() : [1];
  const elCount = snapshot? snapshot.elevators.length : 4;
  const baseW = Math.max(wrap.clientWidth-20, elCount*140+150);
  const baseH = Math.max(wrap.clientHeight-20, (floors.length+1)*48+70);
  const w = baseW*ui.zoom, h = baseH*ui.zoom;
  const wPx=w+'px', hPx=h+'px';
  if(canvas.style.width===wPx && canvas.style.height===hPx) return;
  canvas.width=w*devicePixelRatio; canvas.height=h*devicePixelRatio;
  canvas.style.width=wPx; canvas.style.height=hPx;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resizeCanvas);
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
let COLORS = null;
function computeColors(){
  const cs = getComputedStyle(document.body); const g = n => cs.getPropertyValue(n).trim();
  COLORS = {
    text1:g('--text-1'), text2:g('--text-2'), border:g('--border-strong'),
    accent:g('--accent'), accent2:g('--accent-2'), danger:g('--danger'), warning:g('--warning'), success:g('--success'),
    vip:g('--p-vip'), bg0:g('--bg-0'), bg1:g('--bg-1'), bg2:g('--bg-2'),
    priority:{normal:g('--p-normal'), staff:g('--p-staff'), elderly:g('--p-elderly'), disabled:g('--p-disabled'),
      vip:g('--p-vip'), medical:g('--p-medical'), emergency:g('--p-emergency'), firefighter:g('--p-firefighter')}
  };
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawPersonIcon(x,y,color,scale){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-scale*1.2,scale*0.62,0,7); ctx.fill(); roundRect(ctx,x-scale*0.75,y-scale*0.5,scale*1.5,scale*1.5,scale*0.5); ctx.fill(); }

function drawShaft(){
  if(!snapshot) return;
  resizeCanvas();
  const floors = floorRange().sort((a,b)=>b-a);
  const w=canvas.width/devicePixelRatio, h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  const labelW=78, roofRowH=34, rowH=(h-40-roofRowH)/floors.length;
  const carW = Math.min(104, (w-labelW-24)/snapshot.elevators.length - 12);
  if(!COLORS) computeColors();
  const {text1,text2,border,accent,danger,warning,success,vip,bg2}=COLORS;

  ctx.save(); ctx.strokeStyle='rgba(232,163,61,0.045)'; ctx.lineWidth=1;
  for(let gx=labelW; gx<w-10; gx+=24){ ctx.beginPath(); ctx.moveTo(gx,16); ctx.lineTo(gx,h-10); ctx.stroke(); }
  for(let gy=16; gy<h-10; gy+=24){ ctx.beginPath(); ctx.moveTo(labelW,gy); ctx.lineTo(w-10,gy); ctx.stroke(); }
  ctx.restore();

  ctx.fillStyle=bg2; ctx.fillRect(labelW,16,w-labelW-14,roofRowH-2);
  ctx.strokeStyle=border; ctx.strokeRect(labelW,16,w-labelW-14,roofRowH-2);
  ctx.fillStyle=text2; ctx.font='700 10px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('◤ ROOF · MECHANICAL DECK', labelW+10, 16+roofRowH/2-1);

  floors.forEach((f,i)=>{
    const y=20+roofRowH+i*rowH;
    const activeFloor = snapshot.elevators.some(e=>Math.round(e.currentFloor)===f && (e.doorState==='open'||e.doorState==='opening'));
    if(activeFloor){ ctx.fillStyle=accent+'14'; ctx.fillRect(labelW,y,w-labelW-14,rowH); }
    ctx.strokeStyle=border; ctx.beginPath(); ctx.moveTo(labelW,y+rowH); ctx.lineTo(w-10,y+rowH); ctx.stroke();
    ctx.fillStyle = f===snapshot.building.lobby? accent : (snapshot.building.vipFloors.includes(f)? vip : text1);
    ctx.font='700 12px monospace'; ctx.fillText(floorLabel(f), 8, y+rowH/2-6);
    const tag = floorTag(f);
    if(tag){ ctx.fillStyle=text2; ctx.font='600 8.5px sans-serif'; ctx.fillText(tag, 8, y+rowH/2+8); }
    const waitCount = snapshot.passengers.filter(p=>p.state==='waiting' && p.origin===f).length;
    if(waitCount>0){
      ctx.fillStyle=warning; ctx.beginPath(); ctx.arc(labelW-12,y+rowH/2-10,7,0,7); ctx.fill();
      ctx.fillStyle='#1a1206'; ctx.font='700 9px monospace'; ctx.textAlign='center';
      ctx.fillText(waitCount, labelW-12, y+rowH/2-9); ctx.textAlign='left';
    }
  });

  snapshot.elevators.forEach((e,ei)=>{
    const x0=labelW+24+ei*(carW+16), shaftTop=16+roofRowH, shaftBottom=shaftTop+floors.length*rowH-4;
    ctx.strokeStyle=border; ctx.strokeRect(x0-4,shaftTop,carW+8,shaftBottom-shaftTop);
    ctx.fillStyle=text2; ctx.font='700 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('CAR '+e.label, x0+carW/2, shaftTop-10); ctx.textAlign='left';

    const topFloor=floors[0], botFloor=floors[floors.length-1];
    const frac=(topFloor-e.currentFloor)/(topFloor-botFloor);
    const carY = shaftTop+frac*(shaftBottom-shaftTop-rowH*0.82);
    const carH = rowH*0.82, carCenterX = x0+carW/2;

    ctx.strokeStyle=border; ctx.lineWidth=1.2; ctx.setLineDash([2,4]);
    ctx.lineDashOffset = -((snapshot.simSeconds*40)%6)*e.direction;
    ctx.beginPath(); ctx.moveTo(carCenterX,shaftTop); ctx.lineTo(carCenterX,carY); ctx.stroke(); ctx.setLineDash([]);

    let color=accent;
    if(e.fault) color=danger; else if(e.maintenance||e.inspection) color=warning;
    else if(e.state==='moving') color=success; else if(e.fault||e.maintenance) color=danger;

    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=10;
    const grad=ctx.createLinearGradient(x0,carY,x0,carY+carH); grad.addColorStop(0,color+'2A'); grad.addColorStop(1,color+'10');
    ctx.fillStyle=grad; ctx.strokeStyle=color; ctx.lineWidth=1.6;
    roundRect(ctx,x0,carY,carW,carH,6); ctx.fill(); ctx.stroke(); ctx.restore();

    const doorGap = e.doorState==='closed'? 0 : (e.doorState==='open'?1:e.doorProgress) * (carW*0.42);
    ctx.fillStyle=COLORS.bg0;
    if(e.doorState!=='closed'){ ctx.fillRect(x0+2,carY+2,Math.max(0,doorGap),carH-4); ctx.fillRect(x0+carW-2-doorGap,carY+2,Math.max(0,doorGap),carH-4); }
    ctx.strokeStyle=color+'70'; ctx.beginPath(); ctx.moveTo(x0+carW/2,carY+2); ctx.lineTo(x0+carW/2,carY+carH-2); ctx.stroke();

    ctx.fillStyle=COLORS.bg1; ctx.strokeStyle=border; roundRect(ctx,x0+carW/2-19,carY-24,38,16,4); ctx.fill(); ctx.stroke();
    ctx.fillStyle=color; ctx.font='700 12px monospace'; ctx.textAlign='center'; ctx.fillText(floorLabel(Math.round(e.currentFloor)), x0+carW/2, carY-16);
    ctx.font='11px sans-serif'; ctx.fillStyle=e.direction!==0?color:text2;
    ctx.fillText(e.direction>0?'▲':e.direction<0?'▼':'—', x0+carW/2, carY-30); ctx.textAlign='left';

    const onboard = snapshot.passengers.filter(p=>p.state==='riding' && p.assignedElevatorId===e.id);
    const dotsPerRow=Math.ceil(Math.sqrt(snapshot.building.capacity));
    onboard.forEach((p,pi)=>{
      const col=pi%dotsPerRow, row=Math.floor(pi/dotsPerRow);
      drawPersonIcon(x0+10+col*9, carY+11+row*9, COLORS.priority[p.priority]||COLORS.priority.normal, 3.1);
    });

    const occFrac=e.passengerCount/snapshot.building.capacity, weightFrac=e.weight/snapshot.building.weightLimit;
    const barY=carY+carH+6;
    ctx.fillStyle=border; ctx.fillRect(x0,barY,carW,3);
    ctx.fillStyle= occFrac>0.9?danger:occFrac>0.7?warning:cssVar('--accent-2');
    ctx.fillRect(x0,barY,carW*Math.min(1,occFrac),3);
    ctx.font='600 8px monospace'; ctx.fillStyle=text2; ctx.fillText(e.passengerCount+'/'+snapshot.building.capacity, x0, barY+13);
    ctx.textAlign='right'; ctx.fillStyle= weightFrac>0.95?danger:weightFrac>0.75?warning:text2;
    ctx.fillText(Math.round(e.weight)+'kg', x0+carW, barY+13); ctx.textAlign='left';
  });

  floors.forEach((f,i)=>{
    const y=20+roofRowH+i*rowH;
    const waiting = snapshot.passengers.filter(p=>p.state==='waiting' && p.origin===f);
    waiting.slice(0,8).forEach((p,pi)=>{
      const px=labelW-8-((pi%4)*10), py=y+rowH/2+10+Math.floor(pi/4)*10;
      drawPersonIcon(px,py, COLORS.priority[p.priority]||COLORS.priority.normal, 2.6);
    });
  });
}

function tabAnalytics(){ return `<div class="panel-section"><h3>Live Metrics</h3><div class="analytics-grid" id="analyticsGrid"></div></div>
  <div class="panel-section"><h3>Live Charts</h3><div id="chartsBox"></div></div>`; }
function tabReports(){ return `
  <div class="panel-section"><h3>Generate Report</h3>
    <div class="field-row"><div class="field"><label>Type</label><select id="reportType">
      <option value="simulation">Simulation</option><option value="performance">Performance</option><option value="energy">Energy</option>
      <option value="fault">Fault</option><option value="passenger">Passenger</option><option value="daily">Daily</option>
      <option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
      <div class="field"><label>Format</label><select id="reportFormat"><option value="json">JSON</option><option value="csv">CSV</option></select></div></div>
    <div class="btn-row"><button class="btn primary" id="exportBtn">Export Report</button></div>
    <div class="hint">Reports are generated server-side and persisted to MySQL for audit history.</div></div>`; }
function tabLogs(){ return `
  <input id="logSearch" placeholder="Search logs…" value="${ui.logSearch}"/>
  <div class="log-filters" id="logFilters">${['all','dispatch','passenger','elevator','safety','fault','system'].map(f=>`<div class="chip-filter ${ui.logFilter===f?'active':''}" data-filter="${f}">${f}</div>`).join('')}</div>
  <div id="logList"></div>`; }

const TAB_RENDER = {config:tabConfig, requests:tabRequests, algorithm:tabAlgorithm, safety:tabSafety, analytics:tabAnalytics, reports:tabReports, logs:tabLogs};

function renderTab(name){
  document.getElementById('tabContent').innerHTML = TAB_RENDER[name]();
  bindTabEvents(name);
  if(name==='algorithm') renderAlgoGrid();
  if(name==='requests') renderHallCallList();
  if(name==='analytics') renderAnalyticsTab();
  if(name==='logs') refreshLogs();
}

function renderAlgoGrid(){
  const grid = document.getElementById('algoGrid'); if(!grid) return;
  const current = snapshot? snapshot.algorithm : 'look';
  grid.innerHTML = Object.entries(ALGO_META).map(([id,desc])=>`<div class="algo-card ${current===id?'active':''}" data-algo="${id}"><span class="name">${id.toUpperCase()}</span><span class="desc">${desc}</span></div>`).join('');
  grid.querySelectorAll('.algo-card').forEach(c=>c.addEventListener('click', async ()=>{
    await api('/api/algorithm','POST',{algorithm:c.dataset.algo});
    renderAlgoGrid();
  }));
}
function renderAlgoBars(){
  const box = document.getElementById('algoBars'); if(!box) return;
  const entries = Object.entries(ui.algoStats).map(([k,v])=>[k, v.length? v.reduce((a,b)=>a+b,0)/v.length : 0]);
  const max = Math.max(1, ...entries.map(e=>e[1]));
  box.innerHTML = entries.length? entries.map(([k,v])=>`<div>${k.toUpperCase()} — ${v.toFixed(1)}s avg wait<div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div></div>`).join('') : '<div class="hint">No data yet.</div>';
}
function renderHallCallList(){
  const box = document.getElementById('hallCallList'); if(!box || !snapshot) return;
  box.innerHTML = snapshot.hallCalls.slice(-30).reverse().map(h=>{
    const car = snapshot.elevators.find(e=>e.id===h.elevatorId);
    return `<div class="log-entry ${h.assigned?'passenger':'safety'}">#${h.id} ${floorLabel(h.floor)} (${h.dir}) — ${h.assigned?'Car '+(car?car.label:'?'):'unassigned'} · ${h.priority}</div>`;
  }).join('') || '<div class="hint">No active hall calls.</div>';
}
function renderAnalyticsTab(){
  const grid = document.getElementById('analyticsGrid'); if(!grid || !snapshot) return;
  const a = snapshot.analytics;
  const items = [['Active Passengers',a.activePassengers],['Waiting Passengers',a.waitingPassengers],
    ['Avg Wait Time',a.avgWaitTime.toFixed(1)+'s'],['Avg Travel Time',a.avgTravelTime.toFixed(1)+'s'],
    ['Elevator Utilization',a.utilizationPct.toFixed(0)+'%'],['Queue Length',a.queueLength],
    ['Completed Requests',a.completed],['Rejected Requests',a.rejected],
    ['Trips (Completed Journeys)',a.trips],['Stops',a.stops],
    ['Energy Consumption',a.energy.toFixed(0)+' kWh'],['Fault Count',a.faultCount]];
  grid.innerHTML = items.map(([l,v])=>`<div class="metric-card"><div class="mc-value">${v}</div><div class="mc-label">${l}</div></div>`).join('');
  renderCharts();
}
const CHART_DEFS=[['waitTime','Wait Time (s)'],['travelTime','Travel Time (s)'],['requestsPerMin','Requests / Minute'],['utilization','Utilization (%)'],['energy','Energy (kWh)'],['faults','Fault Count']];
let chartCtxs={};
function renderCharts(){
  const box=document.getElementById('chartsBox'); if(!box) return;
  if(!box.dataset.built){
    box.innerHTML = CHART_DEFS.map(([k,t])=>`<div style="background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:var(--glass-inset);"><div style="font-size:10.5px;font-weight:700;color:var(--text-1);margin-bottom:6px;">${t}</div><canvas id="cc-${k}" width="360" height="70" style="width:100%;height:70px;"></canvas></div>`).join('');
    box.dataset.built='1'; chartCtxs={}; CHART_DEFS.forEach(([k])=>chartCtxs[k]=document.getElementById('cc-'+k).getContext('2d'));
  }
  CHART_DEFS.forEach(([k])=>{
    const data=ui.history[k]; const cvs=chartCtxs[k].canvas; const cctx=chartCtxs[k];
    const w=cvs.clientWidth||360,h=70;
    if(cvs.width!==w*devicePixelRatio){ cvs.width=w*devicePixelRatio; cvs.height=h*devicePixelRatio; cctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    cctx.clearRect(0,0,w,h); if(data.length<2) return;
    const max=Math.max(1,...data); const color=cssVar('--accent');
    cctx.beginPath();
    data.forEach((v,i)=>{ const x=(i/59)*w, y=h-6-(v/max)*(h-14); if(i===0) cctx.moveTo(x,y); else cctx.lineTo(x,y); });
    cctx.strokeStyle=color; cctx.lineWidth=2; cctx.stroke();
  });
}
async function refreshLogs(){
  const params = new URLSearchParams();
  if(ui.logFilter!=='all') params.set('category', ui.logFilter);
  if(ui.logSearch) params.set('search', ui.logSearch);
  params.set('limit','150');
  try{
    const logs = await api('/api/logs?'+params.toString());
    const list = document.getElementById('logList'); if(!list) return;
    list.innerHTML = logs.slice().reverse().map(l=>`<div class="log-entry ${l.category}"><span class="t">Day ${l.simDay} ${l.simClock}</span>${escapeHtml(l.message)}</div>`).join('');
  }catch(e){}
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function bindTabEvents(name){
  if(name==='config'){
    document.getElementById('applyConfigBtn').addEventListener('click', async function(){
      this.disabled=true;
      const cur = snapshot ? snapshot.building : {name:'Infinity Tower',floors:12,basements:2,lobby:1,idleFloor:1,elevatorCount:4,capacity:8,weightLimit:900,maxSpeed:2.2,acceleration:1.1,deceleration:1.1,doorOpenTime:1.6,doorCloseTime:1.6,loadTime:1.2,unloadTime:1.0};
      const num = (id, fallback) => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? fallback : v; };
      const intVal = (id, fallback) => { const v = parseInt(document.getElementById(id).value); return isNaN(v) ? fallback : v; };
      const b = {
        name: document.getElementById('cfgName').value || cur.name,
        floors: intVal('cfgFloors', cur.floors),
        basements: intVal('cfgBasements', cur.basements),
        lobby: intVal('cfgLobby', cur.lobby),
        idleFloor: intVal('cfgIdle', cur.idleFloor),
        parkingFloors: csvToInts(document.getElementById('cfgParking').value),
        vipFloors: csvToInts(document.getElementById('cfgVip').value),
        serviceFloors: csvToInts(document.getElementById('cfgService').value),
        mechanicalFloors: csvToInts(document.getElementById('cfgMechanical').value),
        elevatorCount: Math.max(1, Math.min(16, intVal('cfgElevators', cur.elevatorCount))),
        capacity: intVal('cfgCapacity', cur.capacity),
        weightLimit: intVal('cfgWeight', cur.weightLimit),
        maxSpeed: num('cfgMaxSpeed', cur.maxSpeed),
        acceleration: num('cfgAccel', cur.acceleration),
        deceleration: num('cfgDecel', cur.deceleration),
        doorOpenTime: num('cfgDoorOpen', cur.doorOpenTime),
        doorCloseTime: num('cfgDoorClose', cur.doorCloseTime),
        loadTime: num('cfgLoadTime', cur.loadTime),
        unloadTime: num('cfgUnloadTime', cur.unloadTime),
        energySaving: document.getElementById('cfgEnergySaving').checked,
        algorithm: snapshot? snapshot.algorithm : 'look'
      };
      try {
        await api('/api/config','PUT', b);
      } catch(err) {
        console.error('Apply config failed', err);
        alert('Could not apply configuration — check the backend is running and reachable.');
      } finally {
        this.disabled=false;
      }
    });
    document.getElementById('resetSimBtn').addEventListener('click', ()=>api('/api/simulation/reset','POST'));
  }
  if(name==='requests'){
    document.getElementById('spawnBtn').addEventListener('click', async function(){
      const origin = parseInt(document.getElementById('reqOrigin').value);
      const dest = parseInt(document.getElementById('reqDest').value);
      if(origin===dest){ alert('Origin and destination must differ.'); return; }
      this.disabled=true;
      try {
        await api('/api/requests/spawn','POST', {
          origin, dest,
          priority: document.getElementById('reqPriority').value,
          group: parseInt(document.getElementById('reqGroup').value)||1
        });
      } catch(err) {
        console.error('Spawn request failed', err);
      } finally {
        this.disabled=false;
      }
    });
    document.getElementById('spawnBatchBtn').addEventListener('click', ()=>api('/api/requests/batch?count=10','POST'));
    document.getElementById('autoGenMode').addEventListener('change', e=>{
      api('/api/requests/autogen','POST', {mode:e.target.value, ratePerMinute: parseFloat(document.getElementById('autoGenRate').value)||6});
    });
    document.getElementById('autoGenRate').addEventListener('change', e=>{
      api('/api/requests/autogen','POST', {mode:document.getElementById('autoGenMode').value, ratePerMinute: parseFloat(e.target.value)||6});
    });
  }
  if(name==='safety'){
    document.querySelectorAll('[data-safety]').forEach(btn=>btn.addEventListener('click', async ()=>{
      await api('/api/safety/toggle','POST', {key:btn.dataset.safety});
      renderTab('safety');
    }));
    document.getElementById('clearAllSafetyBtn').addEventListener('click', async ()=>{
      await api('/api/safety/clear-all','POST'); renderTab('safety');
    });
    document.querySelectorAll('#faultElevatorSelect .es-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      ui.selectedElevatorForFault=parseInt(btn.dataset.id); renderTab('safety');
    }));
    document.querySelectorAll('[data-fault]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const id = snapshot.elevators[ui.selectedElevatorForFault].id;
      await api('/api/safety/fault','POST', {elevatorId:id, action:'inject', faultType:btn.dataset.fault});
      renderTab('safety');
    }));
    document.getElementById('clearFaultBtn').addEventListener('click', async ()=>{
      const id = snapshot.elevators[ui.selectedElevatorForFault].id;
      await api('/api/safety/fault','POST', {elevatorId:id, action:'clear'}); renderTab('safety');
    });
    document.getElementById('toggleMaintenanceBtn').addEventListener('click', async ()=>{
      const id = snapshot.elevators[ui.selectedElevatorForFault].id;
      await api('/api/safety/fault','POST', {elevatorId:id, action:'maintenance'}); renderTab('safety');
    });
    document.getElementById('toggleInspectionBtn').addEventListener('click', async ()=>{
      const id = snapshot.elevators[ui.selectedElevatorForFault].id;
      await api('/api/safety/fault','POST', {elevatorId:id, action:'inspection'}); renderTab('safety');
    });
    document.getElementById('toggleIndependentBtn').addEventListener('click', async ()=>{
      const id = snapshot.elevators[ui.selectedElevatorForFault].id;
      await api('/api/safety/fault','POST', {elevatorId:id, action:'independent'}); renderTab('safety');
    });
  }
  if(name==='reports'){
    document.getElementById('exportBtn').addEventListener('click', async function(){
      this.disabled=true;
      try {
        const type=document.getElementById('reportType').value, format=document.getElementById('reportFormat').value;
        const res = await fetch(API+'/api/reports?type='+type+'&format='+format);
        if(!res.ok) throw new Error('Report request failed: '+res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=type+'-report.'+format; a.click();
        URL.revokeObjectURL(url);
      } catch(err) {
        console.error('Export failed', err);
        alert('Could not generate the report — check the backend is running.');
      } finally {
        this.disabled=false;
      }
    });
  }
  if(name==='logs'){
    document.querySelectorAll('#logFilters .chip-filter').forEach(chip=>chip.addEventListener('click', ()=>{ ui.logFilter=chip.dataset.filter; renderTab('logs'); }));
    document.getElementById('logSearch').addEventListener('input', e=>{ ui.logSearch=e.target.value; refreshLogs(); });
  }
}
function csvToInts(s){ return s.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)); }

function syncPauseButton(){
  const btn = document.getElementById('pauseBtn');
  btn.textContent = (snapshot && snapshot.running) ? 'Pause' : 'Resume';
}

document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active'); ui.activeTab=tab.dataset.tab; renderTab(tab.dataset.tab);
}));
document.getElementById('pauseBtn').addEventListener('click', async ()=>{
  if(!ui.started) return;
  if(snapshot && snapshot.running) await api('/api/simulation/pause','POST'); else await api('/api/simulation/resume','POST');
});
document.getElementById('speedBtn').addEventListener('click', async function(){
  const speeds=[1,2,4,8]; const cur=parseInt(this.textContent)||1;
  const next = speeds[(speeds.indexOf(cur)+1)%speeds.length];
  await api('/api/simulation/speed','POST', {multiplier: next});
  this.textContent = next+'×';
});
document.getElementById('startFab').addEventListener('click', async ()=>{
  ui.started = true;
  await api('/api/simulation/start','POST');
  document.getElementById('startOverlay').classList.add('hidden');
});
function setZoom(z){
  ui.zoom = Math.min(2, Math.max(0.5, z));
  document.getElementById('zoomLabel').textContent = Math.round(ui.zoom*100)+'%';
  resizeCanvas(); drawShaft();
}
document.getElementById('zoomInBtn').addEventListener('click', ()=> setZoom(ui.zoom+0.15));
document.getElementById('zoomOutBtn').addEventListener('click', ()=> setZoom(ui.zoom-0.15));

computeColors();
renderTab('config');
resizeCanvas();
connectWebSocket();
setInterval(()=>{ if(ui.activeTab==='logs') refreshLogs(); }, 4000);
})();
</script>
</body>
</html>
